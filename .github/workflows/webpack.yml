name: Deploy
on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npx tsx generate.ts && touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
